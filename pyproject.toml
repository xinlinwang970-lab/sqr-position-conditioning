[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqr-repro"
version = "0.1.1"
description = "Independent timbre-position conditioned string quartet source separation prototype."
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy",
  "PyYAML",
  "soundfile",
  "tqdm",
]

[project.optional-dependencies]
torch = ["torch"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

