name: Reproduction request
description: Report inability to reproduce a number from the experiment report
title: "[REPRO] "
labels: ["reproduction"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template if a number in `docs/EXPERIMENT_REPORT.md`
        does not reproduce when you re-run the corresponding experiment.
        Include enough detail that another person can replicate your
        exact setup.
  - type: textarea
    id: reported
    attributes:
      label: Reported number
      description: The exact value from the report and which table/argument it appears in.
      placeholder: |
        Argument 3, ep424 table: P15 SDR_test = +2.51, type1 = +2.27
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed number
      description: The value you obtained instead.
      placeholder: |
        P15 SDR_test = +2.38, type1 = +2.19
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command(s) used
      description: The training and/or evaluation commands you ran.
      placeholder: |
        CUDA_VISIBLE_DEVICES=0 python scripts/train_PureSwap_E1cosine-P15_1000ep.py
        python scripts/evaluate_checkpoint.py --config ... --checkpoint ... --tag ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python, PyTorch, GPU model, CUDA version.
      placeholder: |
        OS: Linux x86_64
        Python: 3.10.20
        PyTorch: 2.0.1+cu118
        GPU: Tesla V100S-32GB
        CUDA: 11.8
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data source and layout
      description: Where you obtained StringQuD / URMP and how you placed them under data/.
    validations:
      required: true
  - type: dropdown
    id: eval_point
    attributes:
      label: Evaluation point
      options:
        - ep274 (update 16225)
        - ep424 (update 25075)
        - final (ep1000 / ep300)
        - Other (specify in context)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any deviation from REPRODUCIBILITY.md, log excerpts, or other notes.
    validations:
      required: false
