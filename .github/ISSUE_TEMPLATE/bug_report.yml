name: Bug report
description: Report incorrect results, broken scripts, or config/code mismatches
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report. Before
        submitting, please search existing issues to avoid duplicates.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands or actions that trigger the bug.
      placeholder: |
        1. Run `python scripts/...`
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (error message, wrong number, etc.).
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, PyTorch version, GPU model.
      placeholder: |
        OS: Linux x86_64
        Python: 3.10
        PyTorch: 2.0.1+cu118
        GPU: Tesla V100S-32GB
    validations:
      required: true
  - type: dropdown
    id: experiment
    attributes:
      label: Affected experiment
      options:
        - author_release (B0)
        - PureSwap P10
        - PureSwap P15
        - PureSwap P50
        - PureSwap E1cosine-B
        - PureNoise E2
        - PureDrop E3
        - PureSwap E4
        - Core library (src/sqr_repro)
        - Evaluation tooling
        - Documentation
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other information, links, or screenshots.
    validations:
      required: false
