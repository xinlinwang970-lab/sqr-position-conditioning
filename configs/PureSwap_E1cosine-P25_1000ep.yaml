schema_version: 1
experiment:
  name: PureSwap_E1cosine_1000ep
  status: ablation_input_shortcut_breaking_position_swap_p025
  seed: 2026
  data_seed: 2026
  sampler_seed: 2026
  model_seed: 2026
  test_only: false
  run_mode: w24_engineering_pilot
paths:
  run_root: runs/PureSwap_E1cosine_1000ep_p025
data:
  root: /mnt/sda/MSS/data
  # E1 ablation: SAME pure-type2 train set as TruePure (no data change).
  manifest: /mnt/sda/MSS/data/manifests/sqr_paper_split_train.jsonl
  target_sampling: paper_c0_wav_randomcrop
  pair_cycle: []
  augmentation: none
  num_workers: 0
  pin_memory: false
  drop_last: true
audio:
  sample_rate: 44100
  channels: 2
  n_fft: 2048
  win_length: 2048
  hop_length: 1024
  num_frames: 176
  center: true
  pad_mode: reflect
  window: hann
  window_periodic: true
  normalized: false
  pack_order: [real_left, real_right, imag_left, imag_right]
  stft_dtype: float32
model:
  n_blocks: 7
  base_channels: 124
  tfc_growth_rate: 124
  internal_channels: 124
  tfc_layers: 5
  kernel_size: [3, 3]
  tdf_bottleneck_factor: 16
  tdf_min_units: 16
  tdf_bias: false
  num_timbres: 3
  num_positions: 4
  condition_route: mid_dual_paper
  embedding_dim: 32
  control_hidden_dims: [64, 128, 256]
  control_dropout: 0.1
  control_hidden_norm: layer_norm
  control_output_norm: none
  modulation: gpocm
  modulation_position: after_tfc_before_tdf
  output_mode: complex_mapping
  activation_checkpointing: false
  architecture_version: PureSwap_E1_mid_dual_paper_c124_warmupcosine_p025
training:
  batch_size: 4
  gradient_accumulation_steps: 1
  precision: fp32
  loss: packed_complex_mse
  optimizer: adam
  learning_rate: 0.0005
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  weight_decay: 0.0
  foreach: false
  gradient_clip_norm: null
  # E1cosine: same position-swap corruption (P_SWAP=0.25) as E1, but warmup_cosine LR
  # (500 upd warmup -> cosine decay 5e-4 to 5e-6) — tests whether LR annealing
  # locks in the good basin reached around ep400-450 under swap noise.
  scheduler: warmup_cosine
  # 300 ep * 59 upd/ep = 17700 upd (screening)
  # RESUMED -> 1000 ep: 59000 upd upper bound (script stops at TARGET_EPOCHS)
  max_attempted_updates: 59000
  validate_every_updates: 0
  checkpoint_every_updates: 1475
  monitor: none
  monitor_mode: min
  compile: false
inference:
  batch_size: 1
  evaluation_protocol: legacy_v1
  overlap_ratio_requested: 0.5
  align_stride_to_stft_hop: false
  blend_window: hann
  blend_weight_floor: 1.0e-8
  keep_original_length: true
  save_subtype: FLOAT
profiling:
  warmup_updates: 0
  measured_updates: 1
  reserved_memory_budget_gib: 30
  budget_is_advisory: true
